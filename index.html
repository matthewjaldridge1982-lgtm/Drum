<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKO ComputeRhythm — 3D</title>
<style>
  :root { --ink: #ece6df; --ink-dim: #9c9388; --accent: #d94f2b; --accent-2: #4fa3d9; --panel-bg: rgba(20,18,16,0.82); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0a09; color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
  #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }

  header.hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 10px 18px; background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
    pointer-events: none;
  }
  header.hud h1 { margin: 0; font-size: 1.25rem; color: var(--accent); font-family: Georgia, serif; }
  header.hud .subtitle { font-size: 0.78rem; color: var(--ink-dim); }
  header.hud a { color: inherit; }

  .hud-panel {
    position: fixed; z-index: 5;
    background: var(--panel-bg); border: 1px solid #4a443c; border-radius: 8px;
    padding: 10px 12px; font-size: 0.78rem; backdrop-filter: blur(4px);
  }
  #toolbar { top: 56px; right: 16px; display: flex; flex-direction: column; gap: 6px; width: 190px; }
  #toolbar button {
    background: #262320; border: 1px solid #4a443c; color: var(--ink);
    padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 0.76rem;
  }
  #toolbar button:hover { border-color: var(--accent-2); }
  #status { top: 56px; left: 16px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  #status .loading { color: #d9a02b; font-weight: 700; }
  #status .idle { color: var(--ink-dim); }

  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 0.75rem; color: var(--ink-dim); text-align: center; max-width: 640px;
    background: var(--panel-bg); border: 1px solid #4a443c; border-radius: 8px; padding: 8px 14px;
  }

  #loading-veil {
    position: fixed; inset: 0; background: #0b0a09; display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim); font-size: 0.9rem; z-index: 10; transition: opacity 0.3s;
  }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<header class="hud">
  <h1>EKO ComputeRhythm</h1>
  <div class="subtitle">3D panel redesign (experimental) &middot; <a href="tests.html">reader tests</a></div>
</header>

<div id="status" class="hud-panel">Loading…</div>

<div id="toolbar" class="hud-panel">
  <button id="card-new">New card</button>
  <button id="card-export-json">Export card JSON</button>
  <button id="card-import-json">Import card JSON</button>
  <input id="card-import-input" type="file" accept="application/json" style="display:none">
  <button id="card-export-pdf">Export 1:1 PDF</button>
</div>

<div id="hint">
  Drag to orbit. Click a lamp to punch it, click again to unpunch. Press-drag a slider, knob, or the
  card itself to operate it. Drag the card past the slot's edge and back out to re-arm a fresh read.
</div>

<div id="loading-veil">Loading 3D engine…</div>

<script src="vendor/babylonjs/babylon.js"></script>
<script src="js/instruments.js"></script>
<script src="js/audio.js"></script>
<script src="js/matrix.js"></script>
<script src="js/transport.js"></script>
<script src="js/reader.js"></script>
<script src="js/card.js"></script>
<script src="js/swipe.js"></script>
<script src="js/pdf.js"></script>
<script src="js/scene3d.js"></script>
<script>
(function () {
  var statusEl = document.getElementById('status');
  function paintStatus(s) {
    statusEl.innerHTML = (s.loading ? '<span class="loading">LOADING</span>' : '<span class="idle">IDLE</span>') +
      ' &middot; column ' + s.column + ' / 16';
  }

  window.addEventListener('DOMContentLoaded', function () {
    // Matrix needs a DOM container even though we don't render it as HTML --
    // its state/logic is fully reused, just never painted to the DOM.
    var offscreen = document.createElement('div');
    window.EKO.matrix.render(offscreen);

    var canvas = document.getElementById('renderCanvas');
    window.EKO.buildScene3D(canvas, {
      onReaderStatus: paintStatus,
      onReaderChange: function () {}
    });
    paintStatus({ loading: false, column: 0 });

    document.getElementById('loading-veil').style.opacity = '0';
    setTimeout(function () { document.getElementById('loading-veil').style.display = 'none'; }, 320);

    document.body.addEventListener('pointerdown', function once() {
      window.EKO.audio.resume();
      document.body.removeEventListener('pointerdown', once);
    });

    function downloadBlob(blob, filename) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    document.getElementById('card-new').addEventListener('click', function () {
      window.EKO.scene3d.newCard();
    });
    document.getElementById('card-export-json').addEventListener('click', function () {
      var blob = new Blob([window.EKO.cardToJSON(window.EKO.scene3d.getCard())], { type: 'application/json' });
      downloadBlob(blob, 'eko-card.json');
    });
    var importInput = document.getElementById('card-import-input');
    document.getElementById('card-import-json').addEventListener('click', function () { importInput.click(); });
    importInput.addEventListener('change', function () {
      var file = importInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          window.EKO.scene3d.loadCard(window.EKO.cardFromJSON(reader.result));
        } catch (e) {
          alert('Could not read that card file: ' + e.message);
        }
      };
      reader.readAsText(file);
      importInput.value = '';
    });
    document.getElementById('card-export-pdf').addEventListener('click', function () {
      window.EKO.downloadCardPdf(window.EKO.scene3d.getCard(), 'eko-card.pdf');
    });
  });
})();
</script>
</body>
</html>
